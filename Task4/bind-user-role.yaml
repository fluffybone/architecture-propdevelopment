apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-cluster-reader
subjects:
- kind: ServiceAccount
  name: user1-devops
  namespace: dev
roleRef:
  kind: ClusterRole
  name: cluster-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-secrets-binding
  namespace: client-services
subjects:
- kind: ServiceAccount
  name: user2-security
  namespace: client-services
roleRef:
  kind: Role
  name: client-services-secrets-manager
  apiGroup: rbac.authorization.k8s.io 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-developer-binding
  namespace: team-frontend
subjects:
- kind: ServiceAccount
  name: polina-frontend
  namespace: team-frontend
roleRef:
  kind: Role
  name: app-developer-role
  apiGroup: rbac.authorization.k8s.io
